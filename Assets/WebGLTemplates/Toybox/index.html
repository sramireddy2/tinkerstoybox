<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Tinker's Toybox - a forced-perspective puzzle platformer where a tiny action figure resizes the playroom.">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1035; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #1b1035; outline: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(circle at 50% 40%, #3b2a86 0%, #1b1035 70%); color: #fff7e6;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; transition: opacity .5s ease; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader h1 { margin: 0; font-size: clamp(28px, 6vw, 64px); letter-spacing: .02em; text-shadow: 0 4px 0 #ef476f, 0 8px 0 rgba(0,0,0,.25); }
      #bar { width: min(420px, 70vw); height: 16px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
      #fill { width: 0%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffd166, #ef476f, #9b5de5, #06d6a0); transition: width .2s ease; }
      #note { font-size: 14px; opacity: .7; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <h1>Tinker's Toybox</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">Unpacking the toybox...</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#fill");
      var note = document.querySelector("#note");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        loader.classList.add("done");
        canvas.focus();
      }).catch(function (message) {
        note.textContent = "Could not start: " + message;
      });
    </script>
  </body>
</html>
